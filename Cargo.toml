[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
tempfile = "3.20"
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "advanced"] }
