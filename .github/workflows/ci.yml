name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libxfixes-dev fonts-dejavu-core \
            util-linux fdisk dosfstools ntfs-3g xorriso xvfb xauth

      - name: Install stable Rust, rustfmt, and Clippy
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Validate installer staging and desktop integration
        run: |
          python3 tests/installation.py
          bash -n packaging/install.sh packaging/generate-icons.sh

      - name: Exercise write, verification, and corruption handling on owned files
        run: python3 tests/file-integration.py --cli target/release/forgeusb

      - name: Smoke-test the native GUI under a private X server
        run: |
          mkdir -p test-output
          truncate -s 1048576 test-output/gui-smoke-source.img
          python3 tests/gui-smoke.py \
            --binary target/release/forgeusb-gui \
            --source test-output/gui-smoke-source.img \
            --output-dir test-output/ci-gui-smoke
